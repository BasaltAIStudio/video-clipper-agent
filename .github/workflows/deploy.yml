name: Render Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: |
          echo "Triggering Render deployment..."
          curl -X POST https://api.render.com/v1/services/srv-dbfevpfavr4c73dta22g/deploys \
            -H "Authorization: Bearer ${RENDER_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": true}'
